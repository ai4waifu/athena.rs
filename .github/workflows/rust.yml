name: Rust

on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master, dev]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Migration expiry gate
        run: node scripts/migration/check-expiry.mjs
      - name: Neutral surface gate
        run: node scripts/check-neutral-surface.mjs
      - name: Crate dependency gate
        run: node scripts/check-crate-deps.mjs
      - name: Check
        run: cargo check --workspace --all-targets
      - name: Tests
        run: cargo test --workspace --features athena-numeric/ephemeral

  coverage:
    name: Coverage report
    runs-on: ubuntu-latest
    # Report-only: never blocks merge on percentage.
    continue-on-error: true
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - name: Run llvm-cov
        run: |
          cargo llvm-cov --workspace --features athena-numeric/ephemeral --lcov --output-path lcov.info
          cargo llvm-cov --workspace --features athena-numeric/ephemeral --html --output-dir coverage-html
          cargo llvm-cov --workspace --features athena-numeric/ephemeral --summary-only | tee coverage-summary.txt
      - name: Write job summary
        if: always()
        run: |
          {
            echo "## Line coverage (report only)"
            echo
            echo '```'
            cat coverage-summary.txt || echo "(no summary)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-report
          path: |
            lcov.info
            coverage-html
            coverage-summary.txt
          if-no-files-found: warn
