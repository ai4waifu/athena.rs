name: Rust

on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master, dev]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
      - name: Check
        run: cargo check --workspace --all-targets
      - name: Tests
        run: cargo test --workspace
      - name: Numeric N2 promotion gate
        run: cargo test -p athena-numeric --test numeric_promotion_n2
