[package]
name = "athena-numeric"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Athena numeric tower — values, domains, precision, promotion, certificates"
publish = false

[features]
default = ["portable"]
portable = []
native-accelerated = []
mkl = ["native-accelerated"]
blas = ["native-accelerated"]
# Batch-local `EphemeralNatural` / `EphemeralInteger`（Living `19`：非公共数值语义；供 athena-benchmark）。
ephemeral = []

[dependencies]
athena-types = { workspace = true }
athena-gc = { workspace = true }

[lints.rust]
missing_docs = "warn"
# Magnitude union / OwnedLimbBuffer 需要窄域 unsafe；其余模块保持 deny。
unsafe_code = "deny"
