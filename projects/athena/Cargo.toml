[package]
name = "athena"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Athena CAS public Rust facade — stable entry over athena-engine"
publish = false

[features]
default = ["portable"]
portable = ["athena-engine/portable"]

[dependencies]
athena-engine = { workspace = true }
athena-types = { workspace = true }
athena-numeric = { workspace = true }
athena-ir = { workspace = true }
athena-rewriter = { workspace = true }

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"
