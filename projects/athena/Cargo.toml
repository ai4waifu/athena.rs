[package]
name = "athena"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Athena CAS public Rust facade — stable entry over athena-engine"
publish = false

[features]
default = ["pure-rust"]
pure-rust = ["athena-engine/pure-rust"]

[dependencies]
athena-engine = { workspace = true }

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"
