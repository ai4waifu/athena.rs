[package]
name = "athena-vm"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Athena restricted ExecutionIR runtime — frame/slot/safepoint interpreter (not a second engine)"
publish = false

[dependencies]
athena-types = { workspace = true }
athena-gc = { workspace = true }

[lints.rust]
missing_docs = "warn"
# `deny`（非 `forbid`）：解释器 / slot / frame 热路径允许经审查的 `unsafe`。
# 禁止「为了方便」扩大 unsafe 面；禁止绕过 GC root · lease · generation。
unsafe_code = "deny"
