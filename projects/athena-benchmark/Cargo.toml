[package]
name = "athena-benchmark"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Athena kernel contract fixtures and Criterion performance benches"
publish = false

[[bin]]
name = "athena-bench"
path = "src/bin/athena-bench.rs"

[[bench]]
name = "compare_bigint"
harness = false
required-features = ["compare-bigint"]

[[bench]]
name = "path_segments"
harness = false

[features]
default = []
# Reserved for athena-jit; without a JIT crate the jit group is skipped.
jit = []
# External bigint PK peers (Criterion). Never flows into athena-* core crates.
# Pure Rust only. GMP/`gmp-mpfr-sys` needs MSYS2 + windows-gnu and is not wired.
compare-num-bigint = ["dep:num-bigint", "dep:num-traits"]
compare-ibig = ["dep:ibig"]
compare-malachite = ["dep:malachite"]
compare-bigint = ["compare-num-bigint", "compare-ibig", "compare-malachite"]

[dependencies]
athena-numeric = { workspace = true, features = ["ephemeral"] }
athena-gc = { workspace = true }
athena-ir = { workspace = true }
athena-rewriter = { workspace = true }
athena-engine = { workspace = true }
athena-types = { workspace = true }
athena-ndarray = { workspace = true }
athena-graph = { workspace = true }
athena-table = { workspace = true }
athena-jit = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
clap = { workspace = true }
num-bigint = { version = "0.4", default-features = false, features = ["std"], optional = true }
num-traits = { version = "0.2", optional = true }
ibig = { version = "0.3.6", optional = true, default-features = false, features = ["std"] }
malachite = { version = "0.11", optional = true, default-features = false, features = ["naturals_and_integers"] }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"
