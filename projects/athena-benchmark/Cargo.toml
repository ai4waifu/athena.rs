[package]
name = "athena-benchmark"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Athena kernel benchmarks — deterministic fixtures and machine-readable reports"
publish = false

[[bin]]
name = "athena-bench"
path = "src/bin/athena-bench.rs"

[[bench]]
name = "bigint_compare"
harness = false
required-features = ["bigint-compare"]

[features]
default = []
# Reserved for athena-jit; without a JIT crate the jit group is skipped.
jit = []
# Criterion microbench vs external bigints. Does not affect athena-* core crates.
# `ramp` is deprecated / nightly-only; `ibig` is the pure-Rust stand-in.
bigint-compare = ["dep:num-bigint", "dep:num-traits", "dep:ibig"]

[dependencies]
athena-numeric = { workspace = true }
athena-ir = { workspace = true }
athena-rewriter = { workspace = true }
athena-engine = { workspace = true }
athena-types = { workspace = true }
athena-ndarray = { workspace = true }
athena-graph = { workspace = true }
athena-table = { workspace = true }
athena-jit = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
clap = { workspace = true }
num-bigint = { version = "0.4", default-features = false, features = ["std"], optional = true }
num-traits = { version = "0.2", optional = true }
ibig = { version = "0.3.6", optional = true, default-features = false, features = ["std"] }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"
