[package]
name = "athena-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Athena CAS execution engine — Session, eval, rewrite orchestration"
publish = false

[features]
default = ["portable"]
portable = []
jit = ["dep:athena-jit"]

[dependencies]
athena-types = { workspace = true }
athena-gc = { workspace = true }
athena-numeric = { workspace = true }
athena-ir = { workspace = true }
athena-rewriter = { workspace = true }
athena-jit = { workspace = true, optional = true }
athena-graph = { workspace = true }
athena-ndarray = { workspace = true }

[lints.rust]
missing_docs = "warn"
# `deny`（非 `forbid`）：`calculus::ctx::Cc` 经独占生命周期裸指针消除嵌套 builder E0499。
unsafe_code = "deny"
